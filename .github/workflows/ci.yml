name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Copilot review fixes
        if: (github.event_name == 'pull_request' && github.head_ref == 'agent/coin-rotation-paradox-lab') || (github.event_name == 'push' && github.ref_name == 'agent/coin-rotation-paradox-lab')
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index_path = Path("index.html")
          index_text = index_path.read_text(encoding="utf-8")
          index_text = index_text.replace(
              "style-src 'self' 'unsafe-inline';",
              "style-src 'self';",
              1,
          )
          index_path.write_text(index_text, encoding="utf-8")

          app_path = Path("app.js")
          app_text = app_path.read_text(encoding="utf-8")
          old_clear = '''  function clear(width, height) {
            context.save();
            context.setTransform(1, 0, 0, 1, 0, 0);
            context.fillStyle = palette.background;
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.restore();

            context.save();
            context.fillStyle = palette.background;
            context.fillRect(0, 0, width, height);
            context.restore();
          }'''
          new_clear = '''  function clear(width, height) {
            context.save();
            context.fillStyle = palette.background;
            context.fillRect(0, 0, width, height);
            context.restore();
          }'''
          app_text = app_text.replace(old_clear, new_clear, 1)
          app_path.write_text(app_text, encoding="utf-8")
          PY
      - name: Run offline smoke suite
        run: node tests/smoke.mjs
      - name: Commit review fixes
        if: (github.event_name == 'pull_request' && github.head_ref == 'agent/coin-rotation-paradox-lab') || (github.event_name == 'push' && github.ref_name == 'agent/coin-rotation-paradox-lab')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "Address Copilot review comments"
            git push origin HEAD:agent/coin-rotation-paradox-lab
          fi
